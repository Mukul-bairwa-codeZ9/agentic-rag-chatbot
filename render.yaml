services:
  - type: web
    name: agentic-rag-backend
    runtime: node
    rootDir: .
    plan: free

    buildCommand: |
      corepack enable
      pnpm install
      pnpm --filter backend build

    startCommand: |
      pnpm --filter backend start:prod

    envVars:
      - key: NODE_ENV
        value: production

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1

      - key: GOOGLE_API_KEY
        sync: false

      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001

      - key: DOCUMENTS_PATH
        value: apps/backend/src/data/documents

      - key: SQLITE_DB_PATH
        value: apps/backend/src/data/sqlite/orders.db

  - type: web
    name: agentic-rag-frontend
    runtime: node
    rootDir: .
    plan: free

    buildCommand: |
      corepack enable
      pnpm install
      pnpm --filter frontend build

    startCommand: |
      pnpm --filter frontend start

    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false